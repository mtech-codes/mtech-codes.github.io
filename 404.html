<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05020d">
    <title>404 | Lost in Space</title>

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "Poppins", sans-serif;
            background:
                radial-gradient(circle at 50% 45%, rgba(93, 38, 180, 0.14), transparent 28%),
                radial-gradient(circle at 20% 20%, rgba(91, 38, 190, 0.08), transparent 25%),
                radial-gradient(circle at 80% 75%, rgba(51, 23, 130, 0.1), transparent 28%),
                #05020d;
            color: #fff;
            position: relative;
        }

        .space {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            isolation: isolate;
        }

        .space::before,
        .space::after {
            content: "";
            position: absolute;
            inset: -30%;
            pointer-events: none;
            z-index: -2;
        }

        .space::before {
            background:
                radial-gradient(circle at 30% 35%, rgba(137, 75, 255, 0.12), transparent 18%),
                radial-gradient(circle at 70% 65%, rgba(100, 45, 220, 0.1), transparent 20%);
            filter: blur(40px);
            animation: nebulaMove 12s ease-in-out infinite alternate;
        }

        .space::after {
            background: radial-gradient(
                ellipse at center,
                transparent 35%,
                rgba(0, 0, 0, 0.3) 70%,
                rgba(0, 0, 0, 0.65) 100%
            );
            z-index: 4;
        }

        .stars,
        .stars::before,
        .stars::after {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .stars {
            background-image:
                radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.5px),
                radial-gradient(circle, rgba(255,255,255,.6) 0 1px, transparent 1.5px),
                radial-gradient(circle, rgba(177,133,255,.8) 0 1px, transparent 1.5px);
            background-size:
                97px 97px,
                151px 151px,
                211px 211px;
            background-position:
                13px 31px,
                71px 83px,
                29px 17px;
            animation: starsMove 30s linear infinite;
            opacity: .75;
            z-index: -1;
        }

        .stars::before {
            content: "";
            background-image:
                radial-gradient(circle, #fff 0 1.3px, transparent 1.8px),
                radial-gradient(circle, rgba(188,145,255,.9) 0 1.2px, transparent 1.7px);
            background-size: 173px 173px, 263px 263px;
            background-position: 48px 19px, 121px 57px;
            animation: starsMoveReverse 42s linear infinite;
            opacity: .45;
        }

        .stars::after {
            content: "";
            background:
                radial-gradient(circle at 10% 20%, #fff 0 1px, transparent 2px),
                radial-gradient(circle at 85% 18%, #fff 0 1px, transparent 2px),
                radial-gradient(circle at 72% 82%, #fff 0 1px, transparent 2px),
                radial-gradient(circle at 18% 78%, #fff 0 1px, transparent 2px),
                radial-gradient(circle at 55% 12%, #b992ff 0 1.5px, transparent 3px),
                radial-gradient(circle at 42% 90%, #b992ff 0 1.5px, transparent 3px);
            animation: twinkle 3s ease-in-out infinite alternate;
        }

        .shooting-star {
            position: absolute;
            width: 140px;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.95),
                rgba(177,116,255,.8),
                transparent
            );
            filter: drop-shadow(0 0 6px rgba(181,122,255,.9));
            transform: rotate(-32deg);
            opacity: 0;
            z-index: 1;
        }

        .shooting-star:nth-child(2) {
            top: 18%;
            left: -20%;
            animation: shooting 7s linear infinite;
        }

        .shooting-star:nth-child(3) {
            top: 38%;
            left: -20%;
            width: 110px;
            animation: shooting 9s linear 3s infinite;
        }

        .shooting-star:nth-child(4) {
            top: 8%;
            left: 55%;
            width: 90px;
            animation: shootingReverse 11s linear 5s infinite;
        }

        .planet {
            position: absolute;
            width: 330px;
            height: 330px;
            right: -120px;
            top: -120px;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 35% 30%,
                    rgba(255,255,255,.2),
                    transparent 8%
                ),
                radial-gradient(
                    circle at 38% 35%,
                    #7540b8,
                    #271047 48%,
                    #09030f 75%
                );
            box-shadow:
                inset -35px -25px 60px rgba(0,0,0,.8),
                0 0 70px rgba(122,66,220,.16);
            opacity: .4;
            z-index: -1;
            animation: planetFloat 8s ease-in-out infinite alternate;
        }

        .planet::before {
            content: "";
            position: absolute;
            width: 430px;
            height: 100px;
            border: 1px solid rgba(177,130,255,.18);
            border-radius: 50%;
            top: 105px;
            left: -50px;
            transform: rotate(-22deg);
        }

        .planet::after {
            content: "";
            position: absolute;
            inset: 20%;
            border-radius: 50%;
            background: rgba(255,255,255,.03);
            filter: blur(15px);
        }

        .content {
            width: min(92%, 850px);
            text-align: center;
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .error-code {
            font-family: "Orbitron", sans-serif;
            font-size: clamp(7rem, 24vw, 17rem);
            line-height: .82;
            font-weight: 900;
            letter-spacing: -.07em;
            color: #fff;
            position: relative;
            text-shadow:
                0 0 8px rgba(255,255,255,.9),
                0 0 28px rgba(159,94,255,.75),
                0 0 65px rgba(115,55,220,.55),
                0 0 120px rgba(88,34,190,.35);
            animation: errorPulse 4s ease-in-out infinite;
        }

        .error-code::before {
            content: "404";
            position: absolute;
            inset: 0;
            color: transparent;
            -webkit-text-stroke: 1px rgba(180,135,255,.4);
            transform: translate(5px, 4px);
            filter: blur(1px);
            z-index: -1;
        }

        .error-code span {
            display: inline-block;
            animation: digitFloat 4s ease-in-out infinite;
        }

        .error-code span:nth-child(2) {
            animation-delay: .2s;
        }

        .error-code span:nth-child(3) {
            animation-delay: .4s;
        }

        .subtitle {
            margin-top: 28px;
            font-family: "Orbitron", sans-serif;
            font-size: clamp(.85rem, 2vw, 1.15rem);
            font-weight: 600;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: rgba(255,255,255,.82);
            text-shadow: 0 0 14px rgba(160,100,255,.5);
        }

        .thought-box {
            width: min(100%, 600px);
            min-height: 54px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 18px;
        }

        .thought {
            color: rgba(225,215,255,.76);
            font-size: clamp(.78rem, 2vw, .95rem);
            line-height: 1.6;
            opacity: 1;
            transform: translateY(0);
            transition:
                opacity .35s ease,
                transform .35s ease;
        }

        .thought.hide {
            opacity: 0;
            transform: translateY(8px);
        }

        .actions {
            margin-top: 24px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .home-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 170px;
            height: 48px;
            padding: 0 24px;
            border: 1px solid rgba(178,125,255,.55);
            border-radius: 999px;
            background: rgba(91,43,160,.16);
            color: #fff;
            font-family: "Poppins", sans-serif;
            font-size: .86rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            overflow: hidden;
            box-shadow:
                0 0 20px rgba(116,62,210,.14),
                inset 0 0 20px rgba(155,100,255,.04);
            backdrop-filter: blur(10px);
            transition:
                transform .25s ease,
                border-color .25s ease,
                box-shadow .25s ease,
                background .25s ease;
        }

        .home-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 70%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.12),
                transparent
            );
            transform: skewX(-20deg);
            transition: left .6s ease;
        }

        .home-button:hover {
            transform: translateY(-3px);
            border-color: rgba(203,171,255,.9);
            background: rgba(113,58,196,.25);
            box-shadow:
                0 0 24px rgba(130,70,235,.3),
                0 0 55px rgba(112,54,205,.14);
        }

        .home-button:hover::before {
            left: 130%;
        }

        .home-button:active {
            transform: translateY(0) scale(.98);
        }

        .home-button svg {
            width: 17px;
            height: 17px;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .coordinates {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            font-family: "Orbitron", sans-serif;
            font-size: .55rem;
            letter-spacing: .2em;
            color: rgba(255,255,255,.22);
            white-space: nowrap;
            z-index: 5;
        }

        .glow-orb {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #fff;
            box-shadow:
                0 0 5px #fff,
                0 0 15px rgba(176,121,255,.9),
                0 0 30px rgba(130,65,230,.7);
            animation: orbFloat 6s ease-in-out infinite;
            opacity: .7;
        }

        .orb-1 {
            left: 13%;
            top: 32%;
        }

        .orb-2 {
            left: 78%;
            top: 30%;
            animation-delay: 1.7s;
            transform: scale(.65);
        }

        .orb-3 {
            left: 20%;
            bottom: 18%;
            animation-delay: 3s;
            transform: scale(.5);
        }

        .orb-4 {
            right: 17%;
            bottom: 22%;
            animation-delay: 4s;
            transform: scale(.8);
        }

        @keyframes twinkle {
            0% {
                opacity: .25;
                transform: scale(.98);
            }
            50% {
                opacity: .75;
            }
            100% {
                opacity: .35;
                transform: scale(1.02);
            }
        }

        @keyframes starsMove {
            from {
                transform: translate3d(0, 0, 0);
            }
            to {
                transform: translate3d(-90px, 55px, 0);
            }
        }

        @keyframes starsMoveReverse {
            from {
                transform: translate3d(0, 0, 0);
            }
            to {
                transform: translate3d(70px, -45px, 0);
            }
        }

        @keyframes nebulaMove {
            from {
                transform: translate3d(-2%, -1%, 0) scale(1);
            }
            to {
                transform: translate3d(2%, 2%, 0) scale(1.05);
            }
        }

        @keyframes planetFloat {
            from {
                transform: translateY(0) rotate(0deg);
            }
            to {
                transform: translateY(15px) rotate(4deg);
            }
        }

        @keyframes errorPulse {
            0%,
            100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.15);
            }
        }

        @keyframes digitFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        @keyframes shooting {
            0% {
                transform: translate(-10vw, -10vh) rotate(-32deg);
                opacity: 0;
            }
            8% {
                opacity: 1;
            }
            18% {
                opacity: 0;
            }
            100% {
                transform: translate(125vw, 65vh) rotate(-32deg);
                opacity: 0;
            }
        }

        @keyframes shootingReverse {
            0% {
                transform: translate(0, 0) rotate(32deg);
                opacity: 0;
            }
            8% {
                opacity: 1;
            }
            18% {
                opacity: 0;
            }
            100% {
                transform: translate(-90vw, 65vh) rotate(32deg);
                opacity: 0;
            }
        }

        @keyframes orbFloat {
            0%,
            100% {
                transform: translateY(0);
                opacity: .45;
            }
            50% {
                transform: translateY(-18px);
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .planet {
                width: 220px;
                height: 220px;
                right: -100px;
                top: -80px;
            }

            .planet::before {
                width: 290px;
                height: 70px;
                top: 70px;
                left: -35px;
            }

            .error-code {
                font-size: clamp(6.5rem, 30vw, 10rem);
            }

            .subtitle {
                margin-top: 22px;
                letter-spacing: .12em;
            }

            .thought-box {
                min-height: 66px;
                margin-top: 10px;
            }

            .actions {
                margin-top: 16px;
            }

            .home-button {
                min-width: 155px;
                height: 45px;
            }

            .coordinates {
                bottom: 12px;
                font-size: .46rem;
            }

            .shooting-star {
                width: 90px;
            }
        }

        @media (max-height: 650px) {
            .error-code {
                font-size: clamp(5.5rem, 24vh, 10rem);
            }

            .subtitle {
                margin-top: 15px;
            }

            .thought-box {
                margin-top: 5px;
                min-height: 48px;
            }

            .actions {
                margin-top: 10px;
            }

            .coordinates {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="space">
        <div class="stars"></div>

        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>

        <div class="planet"></div>

        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
        <div class="glow-orb orb-4"></div>

        <section class="content">
            <div class="error-code" aria-label="404">
                <span>4</span><span>0</span><span>4</span>
            </div>

            <p class="subtitle">Houston, We Lost The Page</p>

            <div class="thought-box">
                <p class="thought" id="thought">
                    Loading cosmic thoughts...
                </p>
            </div>

            <div class="actions">
                <a class="home-button" href="/">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                            d="M3 10.5 12 3l9 7.5"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                        <path
                            d="M5.5 9.5V20h13V9.5M9.5 20v-6h5v6"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                    Go To Home
                </a>
            </div>
        </section>

        <div class="coordinates">
            MISSION STATUS: PAGE NOT FOUND · SEARCHING THE UNIVERSE
        </div>
    </main>

    <script>
        const thoughts = [
            "I checked the entire galaxy. Your page is definitely not here.",
            "Maybe the page went on vacation without telling anyone.",
            "404: Even the internet has trust issues.",
            "The page has entered stealth mode. Very professional.",
            "We lost the page somewhere between Earth and localhost.",
            "I asked the stars. They said: 'No idea, bro.'",
            "This page was last seen running away at 3,000 Mbps.",
            "Plot twist: the page was never here.",
            "NASA has been notified. They are equally confused.",
            "The server said it exists. The browser said: prove it.",
            "Congratulations! You discovered a secret page that does nothing.",
            "Error 404: Page.exe has stopped believing in itself.",
            "Maybe try going home before we get permanently lost.",
            "The page escaped into another dimension. Classic.",
            "Mission failed successfully. At least the stars look nice."
        ];

        const thought = document.getElementById("thought");

        function randomThought() {
            const current = thought.textContent;
            let next = current;

            while (next === current) {
                next = thoughts[Math.floor(Math.random() * thoughts.length)];
            }

            thought.classList.add("hide");

            setTimeout(() => {
                thought.textContent = next;
                thought.classList.remove("hide");
            }, 350);
        }

        thought.textContent =
            thoughts[Math.floor(Math.random() * thoughts.length)];

        setInterval(randomThought, 4200);
    </script>
</body>
</html>
